name: Chat Bro checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9.12.0 --activate
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: TypeScript
        run: pnpm check
      - name: Tests
        run: pnpm test
      - name: Lint
        run: pnpm lint
      - name: Server build
        run: pnpm build
