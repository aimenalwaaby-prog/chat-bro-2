services:
  - type: web
    name: chatbro-api
    runtime: docker
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: VITE_APP_ID
        sync: false
      - key: OAUTH_SERVER_URL
        value: https://api.manus.im
      - key: BUILT_IN_FORGE_API_URL
        value: https://forge.manus.ai
      - key: BUILT_IN_FORGE_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_BASE_URL
        value: https://api.anthropic.com
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: CLOUDFLARE_MODELS
        value: "@cf/meta/llama-3.1-8b-instruct,@cf/qwen/qwen1.5-7b-chat-awq"
      - key: MODEL_GATEWAYS_JSON
        sync: false
      - key: MODEL_GATEWAY_BASE_URL
        sync: false
      - key: MODEL_GATEWAY_API_KEY
        sync: false
      - key: POLLINATIONS_API_KEY
        sync: false
      - key: COMFYUI_BASE_URL
        sync: false
      - key: COMFYUI_API_KEY
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: FAL_KEY
        sync: false
      - key: PROVIDER_API_KEYS_JSON
        sync: false
      - key: OPENROUTER_DEFAULT_MODEL
        value: openai/gpt-4o-mini
      - key: OPENROUTER_WEB_SEARCH_MODEL
        value: openai/gpt-4o-mini
      - key: ALLOWED_ORIGINS
        value: https://chatbro-web.onrender.com
      - key: OPENROUTER_SITE_URL
        value: https://chatbro.app
      - key: OPENROUTER_APP_NAME
        value: Chat Bro
      - key: PUBLIC_API_BASE_URL
        value: https://chatbro-api.onrender.com
      - key: MAX_UPLOAD_BYTES
        value: "16777216"
      - key: SERVICE_ROLE
        value: api
      - key: IMAGE_SERVICE_URL
        value: https://chatbro-media-3.onrender.com
      - key: IMAGE_SERVICE_TOKEN
        sync: false
  - type: web
    name: chatbro-media-3
    runtime: docker
    healthCheckPath: /api/health
    plan: free
    region: frankfurt
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: SERVICE_ROLE
        value: media
      - key: IMAGE_SERVICE_TOKEN
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: FAL_KEY
        sync: false
      - key: PUBLIC_API_BASE_URL
        value: https://chatbro-media-3.onrender.com
  - type: static_site
    name: chatbro-web
    branch: main
    autoDeploy: yes
    buildCommand: pnpm install --frozen-lockfile && npx expo export --platform web
    publishPath: dist
    envVars:
      - key: EXPO_PUBLIC_API_BASE_URL
        value: https://chatbro-api.onrender.com
      - key: EXPO_PUBLIC_EMBEDDED_RUNTIME
        value: "false"
      - key: EXPO_PUBLIC_OAUTH_SERVER_URL
        value: https://api.manus.im
      - key: EXPO_PUBLIC_OAUTH_PORTAL_URL
        value: https://manus.im
      - key: EXPO_PUBLIC_APP_ID
        value: 77Jvovp6K2UDiC56uFD6LT
